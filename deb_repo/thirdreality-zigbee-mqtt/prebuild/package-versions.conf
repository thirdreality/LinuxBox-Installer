# Package version policy (documentation)
# NOTE: This file documents the intended version policy. The actual behavior
# is implemented in build.sh and prebuild/post-fix-zigbee2mqtt.sh.

# Node.js configuration
# Pinned to the v24.x major line (NodeSource setup_24.x). Do NOT track latest
# LTS to avoid unwanted major-version drift.
# post-fix policy: keep existing node if already on v24.x (no forced patch/minor
# upgrade); only upgrade when the installed major is below 24 (e.g. v22.x -> v24).
NODEJS_LOCK=true
NODEJS_MAJOR="24"

# Mosquitto configuration
# If mosquitto is already installed on the system (e.g. pre-baked image), keep it
# and only (re)configure username/password + conf. Do not force a version change.
MOSQUITTO_LOCK=true
MOSQUITTO_VERSION=""  # Empty means use whatever is installed / bundled
